; ==============================================================================
; Deadly Premonition: The Director's Cut - FreeCam & HUD Hide Mod
; Configuration File (FreeCam.ini)
; ==============================================================================

[General]
; Virtual-Key code to open/close the in-game interactive menu.
; Default: 0x78 (VK_F9) - Avoids conflict with ZachFix (F10) and MapFix (M)
ToggleKey=0x78

; Direct hotkey to toggle FreeCam on/off without opening the menu.
; Default: 0x74 (VK_F5)
FreeCamKey=0x74

; Direct hotkey to toggle HUD visibility on/off.
; Default: 0x73 (VK_F4)
HudHideKey=0x73

; Freeze player/York input while flying in FreeCam mode.
; 1 = Player won't move/shoot while camera flies around
; 0 = Player can still move while camera flies
FreezePlayer=1

[Camera]
; Base flying movement speed in world units per second.
; Default: 15.0
MoveSpeed=15.0

; Fast flying multiplier when holding Shift or Gamepad L3.
; Default: 3.0
FastMultiplier=3.0

; Precision slow flying multiplier when holding Alt or Ctrl.
; Default: 0.25
SlowMultiplier=0.25

; Mouse look sensitivity.
; Default: 0.003
MouseSensitivity=0.003

; Invert vertical (pitch) mouse look axis.
; 0 = Normal, 1 = Inverted
InvertPitch=0

; Invert horizontal (yaw) mouse look axis.
; 0 = Normal (mouse right turns right), 1 = Inverted
InvertYaw=0

; Custom Field of View in degrees.
; Set to 0.0 to retain the game's default camera FOV (~65 degrees).
; Range: 30.0 to 120.0
DefaultFOV=65.0

[HUD]
; Hide HUD initially on game launch.
; 0 = HUD visible by default, 1 = HUD hidden by default
StartHidden=0

[UI]
; Menu window screen coordinates (pixels)
MenuX=50
MenuY=50
MenuWidth=620
MenuHeight=520
